<!DOCTYPE html><html lang="vi"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>Kịch Bản Phân Cảnh & Logic Dựng Phim</title>    <script src="https://cdn.tailwindcss.com"></script>    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">    <style>        body {            font-family: 'Inter', sans-serif;            background-color: #f8fafc;            color: #0f172a;        }        /* Custom Scrollbar for tables */        .table-scroll-container::-webkit-scrollbar {            height: 8px;        }        .table-scroll-container::-webkit-scrollbar-track {            background: #f1f5f9;            border-radius: 4px;        }        .table-scroll-container::-webkit-scrollbar-thumb {            background: #cbd5e1;            border-radius: 4px;        }        .table-scroll-container::-webkit-scrollbar-thumb:hover {            background: #94a3b8;        }        /* Flashcard 3D Flip Styles */        .perspective-1000 {            perspective: 1000px;        }        .transform-style-preserve-3d {            transform-style: preserve-3d;        }        .backface-hidden {            backface-visibility: hidden;        }        .rotate-y-180 {            transform: rotateY(180deg);        }        .group:hover .group-hover\:rotate-y-180 {            transform: rotateY(180deg);        }    </style></head><body class="antialiased pb-20">    <div id="root" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">        <!-- Nội dung sẽ được render bằng JavaScript -->    </div>    <script>        // --- BẮT ĐẦU DỮ LIỆU NỘI DUNG (GIỮ NGUYÊN 100% TEXT GỐC) ---        const introText = "Dưới đây là kịch bản phân cảnh (Shotlist) và logic dựng phim cho 8 phương án đầu tiên. Phần giải thích được rút gọn tối đa (giảm 50% độ dài) để ưu tiên tính thực dụng trên hiện trường.";                 const sectionsData = [             { id: "pa1", title: "P.A 1: DẠY HỌC TRÊN BỤC GIẢNG (01_DayHoc_ChiaSe)", logic: [ "1. Logic Storytelling:", "Ý nghĩa: Tính chuyên gia, sự cho đi, định hướng đám đông.", "Ghép Voice-over: Nhấn mạnh tầm nhìn, chia sẻ kiến thức, hoặc dẫn dắt đội ngũ.", "Nhịp điệu: Năng lượng cao, nhịp nhàng.", "2. Thứ tự quay: Toàn -> Trung -> Cận -> Qua vai -> Đặc tả. Giữ nguyên đèn rọi mặt, quay góc rộng trước lấy tổng thể, ép sát lấy cảm xúc, cuối cùng quay đặc tả tay viết bảng." ], tableHeaders: ["STT", "Cỡ cảnh & Góc máy", "Setup", "Ánh sáng", "Vibe", "Diễn xuất của Nhân vật", "Note"], tableRows: [ ["1", "Toàn (Wide)\nTừ cuối lớp, lấy bục giảng & bóng lưng người nghe (Foreground).", "Đèn 1: Chéo 45 độ rọi mặt.\nĐèn 2: Giấu sau bảng hắt ven lên vai.", "Uy tín, kiểm soát.", "Say sưa giảng bài, vung tay điều hướng, đi lại quanh bục giảng.", "Khóa nét toàn cảnh. Giữ Rắc-co tay cầm phấn/bút."], ["2", "Trung (Medium)\nGóc thấp nhẹ, lấy ngang hông hất lên.", "Giữ nguyên.", "Quyền lực.", "Diễn lại hành động vung tay giải thích, ánh mắt bao quát lớp.", "Góc thấp giúp nhân vật trông lớn hơn, đáng tin cậy."], ["3", "Cận (Close-up)\nGóc ngang ngực.", "Giữ nguyên.", "Nhiệt huyết.", "Mỉm cười, mắt sáng lên, gật đầu khẳng định.", "Khóa nét (AF Lock) vào mắt."], ["4", "Đặc tả (Insert)\nDí sát mặt bảng.", "Đưa Đèn 2 hắt sệt mặt bảng.", "Chuyên môn.", "Tay viết dứt khoát 1 từ khóa lên bảng.", "Thu âm tiếng phấn/bút (Foley)."] ] },             { id: "pa2", title: "P.A 2: LÀM VIỆC Ở BAN CÔNG (02_BanCong_DeepWork)", logic: [ "1. Logic Storytelling:", "Ý nghĩa: Không gian mở, sự tự do (Freelance), tầm nhìn xa hoặc trạng thái tập trung sâu.", "Ghép Voice-over: \"Làm việc độc lập\", \"tìm kiếm ý tưởng mới\", \"thoát khỏi không gian gò bó\".", "Nhịp điệu: Tĩnh lặng, steady (ổn định).", "2. Thứ tự quay: Toàn -> Trung -> Cận. Lấy bối cảnh rộng để thấy sự tương phản (người nhỏ/không gian lớn) trước khi đặc tả màn hình." ], tableHeaders: ["STT", "Cỡ cảnh & Góc máy", "Setup Ánh sáng", "Vibe", "Diễn xuất của Nhân vật", "Note"], tableRows: [ ["1", "Toàn (Wide)\nGóc cao từ tầng trên hoặc lùi xa lấy toàn cảnh ban công.", "Ánh sáng tự nhiên.", "Tự do, cô độc.", "Ngồi tĩnh, cặm cụi gõ máy. Lâu lâu vươn vai nhìn ra xa.", "Để máy tĩnh lấy sự dịch chuyển của gió/cây cỏ xung quanh."], ["2", "Trung (Medium)\nGóc nghiêng 90 độ (Profile).", "Đèn 1: Hắt nhẹ bù sáng mặt nếu ngược nắng tự nhiên.", "Tập trung.", "Mắt dán vào màn hình, tay gõ phím đều.Lấy được cả nhân vật và màn hình laptop.", "Lấy được cả nhân vật và màn hình laptop."], ["3", "Cận (Close-up)\nĐặt máy sát bàn phím hất lên mặt.", "Tăng độ sáng màn hình laptop để hắt vào mặt.", "Nảy số, \"Flow state\".", "Chăm chú, ánh sáng màn hình phản chiếu trong mắt/kính.", "Đợi nhân vật chớp mắt hoặc gật gù mới hô Cắt."] ] },             { id: "pa3", title: "P.A 3: PHA CAFE GÓI (03_PhaCafe_NangLuong)", logic: [ "1. Logic Storytelling:", "Ý nghĩa: Sự chuẩn bị, chạy deadline đêm, hoặc nạp năng lượng khởi đầu ngày mới.", "Ghép Voice-over: \"Bắt đầu ngày mới\", \"Những đêm thức trắng\", \"Cần một sự tỉnh táo\".", "Nhịp điệu: Chậm rải, tăng dần tốc độ.", "2. Thứ tự quay: Trung -> Cận -> Đặc tả. Setup đèn ngược sáng (Backlight) cho đặc tả dòng nước/khói ở cuối cùng để tối ưu thời gian." ], tableHeaders: ["STT", "Cỡ cảnh & Góc máy", "Setup Ánh sáng", "Vibe", "Diễn xuất của Nhân vật", "Note"], tableRows: [ ["1", "Trung (Medium)\nGóc chéo 45 độ, ngang ngực.", "Đèn 1: Rọi mặt.\nĐèn 2: Đánh ven tóc.", "Chưa tỉnh táo, uể oải.", "Đi vào, xé gói cafe đổ vào cốc. Khuấy chậm rãi. Nhấp môi uống.", "Rắc-co tay cầm cốc và thìa."], ["2", "Cận (Close-up)\nGóc ngang mặt.", "Giữ nguyên.", "Tỉnh táo hơn.", "Thổi nhẹ, uống 1 ngụm, thở hắt ra sảng khoái, mắt nhìn thẳng.", "Khóa nét vào mắt."], ["3", "Đặc tả (Insert)\nDí sát miệng cốc.", "Đèn 2: Chĩa ngược sáng xuyên qua cốc.", "Kích thích thị giác/thính giác.", "Rót nước sôi, khói bốc lên. Tay khuấy đều.", "Quay Slow-motion. Thu tiếng thìa khuấy lanh canh."] ] },             { id: "pa4", title: "P.A 4: ĐI BỘ DỌC HÀNH LANG (04_HanhLang_TienBuoc)", logic: [ "1. Logic Storytelling:", "Ý nghĩa: Sự tiến lên, vượt qua thử thách, dấn thân vào hành trình.", "Ghép Voice-over: \"Đã đến lúc hành động\", \"Vượt qua sự chần chừ\".", "Nhịp điệu: Nhanh, chuyển động liên tục (Dùng làm Transition).", "2. Thứ tự quay: Toàn tĩnh -> Trung Tracking lùi -> Đặc tả bước chân." ], tableHeaders: ["STT", "Cỡ cảnh & Góc máy", "Setup Ánh sáng", "Vibe", "Diễn xuất của Nhân vật", "Note"], tableRows: [ ["1", "Toàn (Wide)\nMáy tĩnh cuối hành lang.", "Đèn 1 & 2: Hắt tường tản sáng.", "Hành trình dài.", "Bước từ xa tới, vượt qua sát ống kính và ra khỏi khung hình.", "Để máy tĩnh hoàn toàn, nhân vật tự bước qua mờ nhòe."], ["2", "Trung (Tracking)\nĐi lùi trước mặt nhân vật.", "Cầm tay Đèn 2 đi lùi theo rọi mặt.", "Quyết tâm.", "Ánh mắt kiên định nhìn thẳng, sải bước dài, dứt khoát.", "Khóa nét mặt. Giữ khoảng cách cố định giữa máy và nhân vật."], ["3", "Đặc tả (Insert)\nSát mặt sàn.", "Bỏ đèn, dùng sáng tự nhiên.", "Tốc độ.", "Đôi giày bước nhanh/dậm gót dứt khoát.", "Thu âm tiếng giày cộp cộp."] ] },             { id: "pa5", title: "P.A 5: BẾ TẮC / GỤC XUỐNG BÀN (05_BeTac_GucDau)", logic: [ "1. Logic Storytelling:", "Ý nghĩa: Điểm rơi (Low-point), thất bại, cạn kiệt ý tưởng, áp lực.", "Ghép Voice-over: \"Mọi thứ dường như sụp đổ\", \"Tôi hoàn toàn bế tắc\".", "Nhịp điệu: Nặng nề, ngột ngạt.", "2. Thứ tự quay: Toàn (góc cao) -> Trung -> Đặc tả. Góc cao lột tả sự nhỏ bé trước tiên, sau đó lấy cảm xúc vò đầu, cuối cùng là hành động giận dữ (ném giấy/gõ bút)." ], tableHeaders: ["STT", "Cỡ cảnh & Góc máy", "Setup Ánh sáng", "Vibe", "Diễn xuất của Nhân vật", "Note"], tableRows: [ ["1", "Toàn (High Angle)\nMáy chĩa từ trên cao xuống.", "Đèn 1: Đánh ngang 90 độ (Split lighting - 1 nửa mặt tối).", "Nhỏ bé, đơn độc.", "Gục đầu xuống đống tài liệu, hai tay ôm đầu.", "Đánh sáng tương phản cao (sáng/tối rõ rệt)."], ["2", "Trung (Medium)\nGóc ngang bàn.", "Giữ nguyên.", "Giằng xé.", "Ngẩng lên, tháo kính, vuốt mặt thở dài, xoa thái dương.", "Diễn chậm, cảm giác kiệt sức."], ["3", "Đặc tả (Insert)\nDí sát mặt bàn.", "Hắt đèn sệt mặt bàn.", "Ức chế.", "Vo tròn tờ giấy nháp ném mạnh đi / Tay gõ bút cộc cộc dồn dập.", "Cắt cảnh bằng hành động ném giấy."] ] },             { id: "pa6", title: "P.A 6: ĐỌC TÀI LIỆU / GHI CHÉP (06_NghienCuu_FlowState)", logic: [ "1. Logic Storytelling:", "Ý nghĩa: Sự trau dồi, chuẩn bị kỹ lưỡng, tìm kiếm giải pháp.", "Ghép Voice-over: \"Quay lại những thứ cơ bản\", \"Đọc, học và nghiên cứu\".", "Nhịp điệu: Tập trung, ổn định.", "2. Thứ tự quay: Qua vai -> Trung -> Cận mặt." ], tableHeaders: ["STT", "Cỡ cảnh & Góc máy", "Setup Ánh sáng", "Vibe", "Diễn xuất của Nhân vật", "Note"], tableRows: [ ["1", "Qua vai (OTS)\nSau lưng nhìn xuống sách.", "Đèn 1: Hắt sáng sách.\nĐèn 2: Viền tóc.", "Đắm chìm.", "Tay cầm bút dò theo từng dòng chữ.", "Nét vào mặt giấy."], ["2", "Trung (Medium)\nGóc chéo 45 độ.", "Giữ nguyên.", "Chăm chỉ.", "Cúi đầu đọc, lấy bút highlight gạch chân dứt khoát.", "Rắc-co trang sách đang lật."], ["3", "Cận (Close-up)\nDí sát góc nghiêng mặt.", "Giữ nguyên.", "Hấp thu kiến thức.", "Ánh mắt lia ngang theo dòng chữ, khẽ gật gù hiểu ra vấn đề.", "Khóa nét vào mắt."] ] },             { id: "pa7", title: "P.A 7: ĐỨNG NHÌN RA CỬA SỔ (07_CuaSo_SuyTu)", logic: [ "1. Logic Storytelling:", "Ý nghĩa: Hoài niệm, nghĩ về tương lai, cô lập.", "Ghép Voice-over: \"Nhìn lại chặng đường\", \"Tương lai sẽ ra sao?\".", "Nhịp điệu: Chậm, sâu lắng, đậm chất điện ảnh.", "2. Thứ tự quay: Trung (phản chiếu) -> Toàn (Bóng đen Silhouette). Quay phản chiếu ngoài kính trước, sau đó tắt hết đèn phòng để quay bóng đen." ], tableHeaders: ["STT", "Cỡ cảnh & Góc máy", "Setup Ánh sáng", "Vibe", "Diễn xuất của Nhân vật", "Note"], tableRows: [ ["1", "Trung (Medium)\nTừ ngoài hành lang quay qua kính vào trong.", "Tắt hết đèn ngoài, bật đèn trong phòng sáng nhẹ.", "Suy tư, đa chiều.", "Đứng khoanh tay nhìn ra ngoài. Khẽ thở dài.", "Lấy được bóng phản chiếu của cửa sổ/bầu trời đè lên mặt nhân vật."], ["2", "Toàn (Silhouette)\nTừ trong phòng nhìn ra cửa sổ sáng.", "TẮT HẾT ĐÈN trong phòng. Bỏ đèn 1&2.", "Bí ẩn, cô độc.", "Đứng quay lưng, bóng đen in hằn trên nền cửa sổ sáng rực.", "Khóa sáng (AE Lock) vào điểm sáng nhất ngoài cửa sổ để người thành khối đen."] ] },             { id: "pa8", title: "P.A 8: TRÒ CHUYỆN / GỠ RỐI (08_Mentoring_KetNoi)", logic: [ "1. Logic Storytelling:", "Ý nghĩa: Làm việc nhóm, người dẫn dắt, giải quyết vấn đề bằng giao tiếp.", "Ghép Voice-over: \"Sức mạnh tập thể\", \"Lắng nghe để thấu hiểu\", \"Trao giá trị\".", "Nhịp điệu: Ấm áp, vui vẻ, cởi mở.", "2. Thứ tự quay: Toàn (2-shot) -> Qua vai A -> Qua vai B. Setup bối cảnh 2 người tương tác, quay toàn lấy bối cảnh trước, sau đó đặt góc chéo vai xen kẽ." ], tableHeaders: ["STT", "Cỡ cảnh & Góc máy", "Setup Ánh sáng", "Vibe", "Diễn xuất của Nhân vật", "Note"], tableRows: [ ["1", "Toàn (2-Shot)\nGóc ngang lấy trọn vẹn 2 người.", "Đèn 1: Dội tường tản sáng đều cả 2.\nĐèn 2: Ven tóc người ngồi.", "Cởi mở.", "Nhân vật chính chỉ tay vào laptop. Người kia gật gù, cả hai cùng cười tươi.", "Không thu tiếng, chỉ cần diễn nét mặt khẩu hình."], ["2", "Qua vai (OTS) 1\nQua vai người phụ.", "Đèn 1: Rọi nhân vật chính.", "Thấu hiểu.", "Nhân vật chính nhìn người đối diện, gật đầu liên tục, ánh mắt khích lệ.", "Nét căng vào nhân vật chính. Tiền cảnh (vai người phụ) mờ."], ["3", "Qua vai (OTS) 2\nQua vai nhân vật chính.", "Đổi đèn rọi sang mặt người phụ.", "Truyền cảm hứng.", "Người phụ gật đầu, mắt sáng lên hiểu vấn đề. Nhân vật chính vỗ nhẹ vai/bàn.", "Tránh viền trục (Quy tắc 180 độ). Chuyển góc máy nhưng không đổi phe trái-phải của khung hình."] ] },             { id: "extra", title: "CẢNH BỔ SUNG: UỐNG NƯỚC TẠI BÌNH NƯỚC", logic: [], tableHeaders: ["STT Quay", "Cỡ cảnh & Góc máy", "Thời gian", "Setup Ánh sáng", "Vibe (Cảm giác)", "Diễn xuất của Nhân vật", "Note chú ý"], tableRows: [ ["1", "Trung cảnh (Medium)\nGóc ngang hoặc chéo 45 độ, tĩnh. Lấy từ đùi/eo trở lên.", "20s", "Đèn 1 (Key): Đánh xéo 45 độ rọi mặt.\nĐèn 2 (Rim): Đặt lấp ló sau bình nước, đánh ven sáng lên vai/tóc.", "Uể oải ban đầu, sau đó chuyển sang vội vã, dứt khoát.", "(Khung xương hành động): Lững thững bước vào. Một tay hứng nước, đưa lên uống 1 ngụm chậm chạp. Tay kia cầm điện thoại lướt lờ đờ.\n\nĐột nhiên khựng lại. Ngừng uống. Mắt nhìn chằm chằm màn hình/vô định. Hạ nhanh cốc nước xuống, cất điện thoại. Xoay người sải bước đi nhanh.", "Ghi nhớ Rắc-co: Cầm cốc tay nào? Điện thoại tay nào? Chân nào bước xoay người trước? Chờ nhân vật đi khuất hẳn 3s mới hô \"Cắt\"."], ["2", "Cận cảnh (Close-up)\nGóc ngang hoặc hơi hất lên nhẹ. Lấy từ ngực lên đến đỉnh đầu.", "10s", "Giữ nguyên setup của cảnh 1. (Có thể giảm cường độ đèn 1 chút cho khỏi lóa mặt).", "Bừng tỉnh, thông suốt, tập trung cao độ.", "(Chỉ diễn lại khúc khựng và suy nghĩ): Đang nhấp môi uống chậm -> Môi dừng lại -> Nhíu mày, tròng mắt đảo nhẹ (quá trình load thông tin) -> Chớp mắt 2 cái thật nhanh, tròng mắt mở to (Khoảnh khắc Aha!) -> Ánh mắt sắc bén hẳn lên. Cất nhanh điện thoại.", "Khóa nét (AF Lock) thẳng vào mắt. Cảnh này ăn tiền ở biểu cảm \"nảy số\" nên cần bắt trọn sự thay đổi của cơ mặt và ánh mắt."], ["3", "Toàn cảnh / Trung Tracking\nGóc ngang hành lang, máy quay tĩnh hoặc đi lùi theo nhân vật.", "10s", "Dời đèn 1: Đánh tản vào tường hành lang để mở rộng vùng sáng.", "Quyết liệt, tốc độ, khẩn cấp.", "(Chỉ diễn khúc rời đi): Bắt đầu từ động tác vươn tay đặt mạnh cốc nước xuống nóc bình (tạo tiếng \"Cạch\"). Quay ngoắt người thật dứt khoát. Sải bước đi dài, bước đi cực nhanh lướt qua ống kính.", "Tiếng \"Cạch\" đặt cốc là mốc để người dựng phim cắt cảnh. Máy quay có thể tĩnh để nhân vật lướt qua vội và (tạo motion blur nhòe chuyển động) cắt cảnh rất mượt."], ["4", "Đặc tả (Insert)\nDí sát máy vào vòi nước và thành cốc.", "10s", "ĐỔI SETUP: Tắt Đèn 1.\nCầm Đèn 2 đặt đối diện ống kính, chĩa ngược sáng (Backlight) xuyên qua nước.", "Thư giãn, tạo nhịp nghỉ/nhàm chán trước khi có biến.", "(Chỉ diễn tay): Đưa cốc vào. Ngón tay ấn vòi. Nước chảy róc rách vào cốc. (Nếu có khói bốc lên từ nước nóng thì rất điện ảnh).", "Bật chế độ Slow-motion. Ánh sáng ngược làm dòng nước lấp lánh. Dí mic gần thu tiếng nước chảy (Foley)."] ] }         ];                 const flashcardsData = [             { q: "Ý nghĩa của cảnh Dạy học trên bục giảng (P.A 1) là gì?", a: "Tính chuyên gia, sự cho đi, định hướng đám đông." },             { q: "Thứ tự quay P.A 1 gồm những cỡ cảnh nào?", a: "Toàn -> Trung -> Cận -> Qua vai -> Đặc tả." },             { q: "Trong P.A 2 (Ban công), ý nghĩa truyền tải là gì?", a: "Không gian mở, sự tự do (Freelance), trạng thái tập trung sâu." },             { q: "Góc máy Trung cảnh P.A 2 quay từ đâu?", a: "Góc nghiêng 90 độ (Profile)." },             { q: "Setup ánh sáng cho Đặc tả (Insert) ở P.A 3 (Pha cafe) thế nào?", a: "Chĩa đèn 2 ngược sáng (Backlight) xuyên qua cốc." },             { q: "P.A 4 (Đi dọc hành lang) thường dùng làm Transition với nhịp điệu ra sao?", a: "Nhanh, chuyển động liên tục." },             { q: "Góc máy toàn cảnh ở P.A 5 (Bế tắc) sử dụng góc nào?", a: "Góc máy chĩa từ trên cao xuống (High Angle) lột tả sự nhỏ bé." },             { q: "Kiểu ánh sáng Split lighting ở P.A 5 là gì?", a: "Đánh ngang 90 độ, khiến 1 nửa mặt tối, tạo cảm giác đơn độc." },             { q: "Hành động kết thúc cảnh P.A 5 là gì?", a: "Vo tròn tờ giấy nháp ném mạnh đi hoặc gõ bút cộc cộc dồn dập." },             { q: "Rắc-co quan trọng cần chú ý ở P.A 6 (Đọc tài liệu) là gì?", a: "Rắc-co trang sách đang lật." },             { q: "Kỹ thuật quay Silhouette ở P.A 7 yêu cầu ánh sáng thế nào?", a: "Tắt hết đèn trong phòng, khóa sáng vào điểm sáng nhất ngoài cửa sổ." },             { q: "Vibe của P.A 7 (Cửa sổ) hướng tới cảm xúc gì?", a: "Bí ẩn, cô độc, suy tư, hoài niệm." },             { q: "Ý nghĩa của P.A 8 (Trò chuyện) là gì?", a: "Làm việc nhóm, người dẫn dắt, giải quyết vấn đề bằng giao tiếp." },             { q: "Quy tắc máy quay cực kì quan trọng ở cảnh Qua vai P.A 8 là gì?", a: "Tránh viền trục (Quy tắc 180 độ)." },             { q: "Ở cảnh bổ sung (Uống nước), cảnh Trung diễn ra trong bao lâu?", a: "Khoảng 20 giây." },             { q: "Rắc-co hành động cần nhớ ở cảnh Uống nước là gì?", a: "Cầm cốc tay nào, điện thoại tay nào, chân nào bước xoay người trước." },             { q: "Cảnh Cận (Close-up) ở phần Uống nước cần khóa nét vào đâu?", a: "Khóa nét (AF Lock) thẳng vào mắt." },             { q: "Khoảnh khắc 'Aha!' nảy số diễn như thế nào?", a: "Chớp mắt 2 cái thật nhanh, tròng mắt mở to, ánh mắt sắc bén." },             { q: "Mốc âm thanh để người dựng cắt cảnh Uống nước là gì?", a: "Tiếng 'Cạch' khi đặt cốc xuống nóc bình." },             { q: "Cảnh đặc tả dòng nước chảy thu âm kỹ thuật gì?", a: "Thu âm Foley (tiếng nước chảy róc rách)." },             { q: "Đèn ven (Rim light) ở P.A 1 đặt ở đâu?", a: "Giấu sau bảng hắt ven lên vai." },             { q: "P.A 6 (Đọc tài liệu) có nhịp điệu thế nào?", a: "Tập trung, ổn định." },             { q: "Diễn xuất cảnh cận P.A 1 yêu cầu gì?", a: "Mỉm cười, mắt sáng lên, gật đầu khẳng định." },             { q: "Cảnh toàn tĩnh P.A 4 nhân vật di chuyển thế nào?", a: "Bước từ xa tới, vượt qua sát ống kính và ra khỏi khung hình." },             { q: "Góc máy đặc tả P.A 4 (Hành lang) đặt ở đâu?", a: "Sát mặt sàn lấy đôi giày bước nhanh/dậm gót." }         ];        // --- KẾT THÚC DỮ LIỆU ---        // Hàm tạo CSS Abstract Art tương đương với React Component bạn yêu cầu        function getCSSArt(type) {            const baseClass = "relative w-full h-48 md:h-64 rounded-2xl overflow-hidden shadow-lg flex items-center justify-center transition-transform duration-500 hover:scale-[1.02] mb-8";            let specificStyle = "";            let innerHTML = "";            switch(type) {                case 'pa1': // Dạy học - Bảng & ánh sáng (Xanh lá đậm, vệt phấn trắng, luồng sáng)                    specificStyle = "background: linear-gradient(135deg, #064e3b 0%, #022c22 100%);";                    innerHTML = `                        <div class="absolute top-0 left-1/4 w-full h-full bg-white opacity-5 blur-[80px] transform rotate-45"></div>                        <div class="flex flex-col gap-4 w-1/2">                            <div class="w-full h-1 bg-white opacity-30 rounded transform -rotate-2"></div>                            <div class="w-3/4 h-1 bg-white opacity-40 rounded transform rotate-1"></div>                            <div class="w-1/2 h-1 bg-white opacity-20 rounded transform -rotate-1"></div>                        </div>                    `;                    break;                case 'pa2': // Ban công (Gradient không gian, ánh sáng mặt trời/màn hình)                    specificStyle = "background: linear-gradient(to bottom right, #38bdf8, #818cf8, #c084fc);";                    innerHTML = `                        <div class="absolute bottom-0 right-10 w-32 h-32 bg-yellow-300 rounded-full mix-blend-overlay blur-xl opacity-70"></div>                        <div class="w-24 h-16 border-4 border-white/20 rounded backdrop-blur-sm relative">                            <div class="absolute inset-0 bg-white/10"></div>                        </div>                    `;                    break;                case 'pa3': // Cafe (Màu nâu ấm, vòng tròn ly, khói bốc lên)                    specificStyle = "background: linear-gradient(to top right, #451a03, #78350f, #b45309);";                    innerHTML = `                        <div class="w-28 h-28 border-8 border-orange-200/20 rounded-full flex items-center justify-center relative">                            <div class="w-20 h-20 bg-orange-500/20 rounded-full blur-md"></div>                            <div class="absolute -top-12 w-4 h-16 bg-white/10 blur-sm rounded-[50%] animate-pulse"></div>                            <div class="absolute -top-16 left-8 w-3 h-20 bg-white/10 blur-sm rounded-[50%] animate-pulse delay-75"></div>                        </div>                    `;                    break;                case 'pa4': // Hành lang (Điểm tụ, đường chéo tạo tốc độ)                    specificStyle = "background: #1e293b;";                    innerHTML = `                        <div class="absolute inset-0 flex items-center justify-center">                            <div class="w-[150%] h-1 bg-slate-500/30 transform -rotate-[15deg]"></div>                            <div class="w-[150%] h-1 bg-slate-500/30 transform rotate-[15deg] absolute"></div>                        </div>                        <div class="w-16 h-16 rounded-full bg-indigo-500/50 blur-lg relative z-10 animate-bounce"></div>                    `;                    break;                case 'pa5': // Bế tắc (Tương phản gắt, góc tối)                    specificStyle = "background: #0f172a;";                    innerHTML = `                        <div class="absolute left-0 w-1/2 h-full bg-slate-800 border-r border-slate-700"></div>                        <div class="w-20 h-20 bg-black rotate-45 absolute bottom-10 right-1/4 shadow-[0_0_50px_rgba(255,255,255,0.1)]"></div>                    `;                    break;                case 'pa6': // Đọc tài liệu (Giao diện highlight tĩnh lặng)                    specificStyle = "background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);";                    innerHTML = `                        <div class="w-2/3 space-y-3">                            <div class="h-2 w-full bg-blue-500/20 rounded"></div>                            <div class="h-3 w-5/6 bg-blue-400/60 rounded shadow-[0_0_15px_rgba(96,165,250,0.4)]"></div>                            <div class="h-2 w-3/4 bg-blue-500/20 rounded"></div>                            <div class="h-2 w-full bg-blue-500/20 rounded"></div>                        </div>                    `;                    break;                case 'pa7': // Cửa sổ (Bóng đen Silhouette)                    specificStyle = "background: #000;";                    innerHTML = `                        <div class="w-3/5 h-4/5 border-8 border-slate-800 bg-slate-900 flex items-end justify-center relative overflow-hidden">                            <div class="absolute inset-0 bg-gradient-to-t from-cyan-900/40 to-transparent"></div>                            <div class="w-16 h-32 bg-black rounded-t-full z-10 shadow-[0_0_40px_rgba(255,255,255,0.05)]"></div>                        </div>                    `;                    break;                case 'pa8': // Trò chuyện (Vòng tròn giao thoa kết nối)                    specificStyle = "background: linear-gradient(135deg, #f59e0b, #ea580c);";                    innerHTML = `                        <div class="flex items-center justify-center -space-x-6">                            <div class="w-24 h-24 rounded-full bg-white/20 backdrop-blur-md border border-white/30 mix-blend-screen"></div>                            <div class="w-24 h-24 rounded-full bg-white/20 backdrop-blur-md border border-white/30 mix-blend-screen"></div>                        </div>                    `;                    break;                case 'extra': // Uống nước (Màu nước mát, giọt nước)                    specificStyle = "background: linear-gradient(to bottom, #0284c7, #0ea5e9);";                    innerHTML = `                        <div class="w-16 h-24 border-2 border-cyan-100/40 rounded-b-xl rounded-t-sm relative overflow-hidden">                            <div class="absolute bottom-0 w-full h-1/2 bg-cyan-300/50 backdrop-blur-sm"></div>                            <div class="absolute top-4 left-1/2 transform -translate-x-1/2 w-2 h-4 bg-white/50 rounded-[50%] blur-[1px]"></div>                        </div>                    `;                    break;                default:                    specificStyle = "background: #e2e8f0;";            }            return `<div class="${baseClass}" style="${specificStyle}">${innerHTML}</div>`;        }        // --- RENDER GIAO DIỆN CHÍNH ---        document.addEventListener('DOMContentLoaded', () => {            const root = document.getElementById('root');                        // 1. Render Header & Intro            let htmlContent = `                <header class="text-center mb-16">                    <h1 class="text-3xl md:text-5xl font-bold text-slate-900 tracking-tight mb-6">                        Kịch Bản Phân Cảnh<br/>                        <span class="text-indigo-600">& Logic Dựng Phim</span>                    </h1>                    <div class="w-24 h-1 bg-indigo-500 mx-auto mb-6 rounded-full"></div>                    <p class="text-lg md:text-xl text-slate-600 max-w-3xl mx-auto leading-relaxed">                        ${introText}                    </p>                </header>                                <div class="space-y-16">            `;            // 2. Render từng Section (Phương án)            sectionsData.forEach(section => {                htmlContent += `                    <section id="${section.id}" class="bg-white rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] overflow-hidden border border-slate-100">                        <div class="p-6 md:p-10">                            <!-- CSS Abstract Art -->                            ${getCSSArt(section.id)}                                                        <h2 class="text-2xl md:text-3xl font-bold text-slate-800 mb-6 flex items-center">                                <span class="bg-indigo-100 text-indigo-700 p-2 rounded-lg mr-4 text-sm hidden md:inline-block">SCENE</span>                                ${section.title}                            </h2>                            ${section.logic && section.logic.length > 0 ? `                                <div class="bg-slate-50 border border-slate-200 rounded-2xl p-6 mb-8">                                    <h3 class="font-semibold text-slate-800 mb-4 flex items-center text-lg">                                        <svg class="w-5 h-5 text-indigo-500 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>                                        Logic Storytelling                                    </h3>                                    <ul class="space-y-3 text-slate-600 pl-2">                                        ${section.logic.map(item => `                                            <li class="flex items-start">                                                <span class="text-indigo-400 mr-2 mt-1">•</span>                                                <span>${item}</span>                                            </li>                                        `).join('')}                                    </ul>                                </div>                            ` : ''}                            <div class="table-scroll-container overflow-x-auto rounded-xl border border-slate-200">                                <table class="w-full text-left border-collapse min-w-[900px]">                                    <thead>                                        <tr class="bg-slate-50 text-slate-600 text-sm uppercase tracking-wider font-semibold border-b border-slate-200">                                            ${section.tableHeaders.map((header, i) => `                                                <th class="px-6 py-4 ${i===0 ? 'w-16 text-center' : ''}">${header}</th>                                            `).join('')}                                        </tr>                                    </thead>                                    <tbody class="text-slate-700 text-sm align-top">                                        ${section.tableRows.map((row, rowIndex) => `                                            <tr class="hover:bg-indigo-50/30 transition-colors ${rowIndex !== section.tableRows.length - 1 ? 'border-b border-slate-100' : ''}">                                                ${row.map((cell, cellIndex) => `                                                    <td class="px-6 py-5 whitespace-pre-wrap ${cellIndex === 0 ? 'text-center font-medium text-slate-500' : ''}">${cell}</td>                                                `).join('')}                                            </tr>                                        `).join('')}                                    </tbody>                                </table>                            </div>                        </div>                    </section>                `;            });                        htmlContent += `</div>`; // Đóng div.space-y-16            // 3. Render Flashcards (Thẻ lật 3D)            htmlContent += `                <section class="mt-24">                    <div class="text-center mb-12">                        <h2 class="text-3xl md:text-4xl font-bold text-slate-900 mb-4">Flashcards Ôn Tập</h2>                        <p class="text-slate-500">Di chuột hoặc chạm vào thẻ để xem đáp án</p>                    </div>                                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8">                        ${flashcardsData.map((card, index) => `                            <div class="group h-48 md:h-56 perspective-1000 cursor-pointer">                                <div class="relative w-full h-full transition-transform duration-700 transform-style-preserve-3d group-hover:rotate-y-180">                                                                        <!-- Mặt trước (Câu hỏi) -->                                    <div class="absolute w-full h-full backface-hidden bg-white border-2 border-indigo-100 rounded-2xl shadow-sm flex flex-col items-center justify-center p-6 text-center">                                        <span class="absolute top-4 left-4 w-8 h-8 flex items-center justify-center bg-indigo-50 text-indigo-600 rounded-full text-xs font-bold">                                            ${index + 1}                                        </span>                                        <h3 class="font-semibold text-slate-800 text-base md:text-lg">${card.q}</h3>                                        <span class="absolute bottom-4 text-xs text-slate-400 font-medium">Lật xem đáp án ↺</span>                                    </div>                                                                        <!-- Mặt sau (Đáp án) -->                                    <div class="absolute w-full h-full backface-hidden rotate-y-180 bg-gradient-to-br from-indigo-600 to-violet-700 text-white rounded-2xl shadow-lg flex items-center justify-center p-6 text-center">                                        <p class="text-base md:text-lg font-medium leading-snug">${card.a}</p>                                    </div>                                </div>                            </div>                        `).join('')}                    </div>                </section>            `;            root.innerHTML = htmlContent;        });    </script>

<script id="cms-pin-widget">
  if(localStorage.getItem("cms_auth") === "granted") {
    const path = window.location.pathname.split("/").filter(Boolean);
    let repo = "vietndj.github.io", file = "index.html";
    if (path.length > 1) { repo = path[0]; file = path.pop(); }
    else if (path.length === 1) { if (path[0].endsWith(".html")) file = path[0]; else repo = path[0]; }
    const btn = document.createElement("a");
    btn.href = "https://vietndj.github.io/?pin=" + encodeURIComponent(repo + "/" + decodeURIComponent(file));
    btn.innerHTML = "📌 Ghim bài này";
    btn.style.cssText = "position:fixed;top:15px;right:15px;background:#FF9500;color:white;padding:8px 16px;border-radius:20px;font-weight:bold;font-size:12px;z-index:99999;text-decoration:none;box-shadow:0 4px 10px rgba(0,0,0,0.15);transition:all 0.2s ease;";
    btn.onmouseover = () => btn.style.transform = "scale(1.05)";
    btn.onmouseout = () => btn.style.transform = "scale(1)";
    document.body.appendChild(btn);
  }
</script>
