<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mở Antigravity Chat</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 32px 24px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 8px 0;
      color: #38bdf8;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.5;
      margin: 0 0 24px 0;
    }
    .btn {
      display: inline-block;
      background: #0284c7;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      padding: 12px 28px;
      border-radius: 10px;
      transition: background 0.2s ease;
      cursor: pointer;
      border: none;
    }
    .btn:hover {
      background: #0369a1;
    }
    .cid {
      font-family: monospace;
      font-size: 12px;
      color: #64748b;
      margin-top: 16px;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🚀</div>
    <h1>Đang mở Antigravity...</h1>
    <p>Nếu ứng dụng không tự bật lên, vui lòng bấm nút bên dưới:</p>
    <a id="openBtn" class="btn" href="#">Mở Cuộc Trò Chuyện</a>
    <div id="cidText" class="cid"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const cid = params.get("c") || params.get("id") || "";
    const targetUrl = cid ? `antigravity://conversation/${cid}` : "antigravity://";
    
    document.getElementById("openBtn").href = targetUrl;
    if (cid) {
      document.getElementById("cidText").innerText = `ID: ${cid}`;
    }
    
    // Auto redirect
    setTimeout(() => {
      window.location.href = targetUrl;
    }, 150);
  </script>
</body>
</html>
