<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Antigravity Navigator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
         background: #0f0f23; color: #e0e0e0; height: 100vh;
         display: flex; align-items: center; justify-content: center; }
  .card { background: #1a1a2e; border: 1px solid #2a2a4a; border-radius: 16px;
          padding: 32px; max-width: 420px; width: 90%; text-align: center;
          box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
  .icon { font-size: 48px; margin-bottom: 16px; }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 8px; color: #fff; }
  .desc { font-size: 14px; color: #888; margin-bottom: 24px; line-height: 1.5; }
  .cid { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 12px;
         background: #0d1117; border: 1px solid #30363d; border-radius: 8px;
         padding: 10px 14px; color: #58a6ff; word-break: break-all;
         margin-bottom: 20px; cursor: pointer; position: relative; }
  .cid:hover { border-color: #58a6ff; }
  .cid::after { content: "Click to copy"; position: absolute; right: 8px; top: 50%;
                transform: translateY(-50%); font-size: 10px; color: #666; }
  .btn { display: inline-block; padding: 12px 28px; border-radius: 10px;
         font-size: 15px; font-weight: 600; text-decoration: none;
         transition: all 0.2s; margin: 4px; }
  .btn-primary { background: #238636; color: #fff; border: 1px solid #2ea043; }
  .btn-primary:hover { background: #2ea043; }
  .btn-secondary { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; }
  .btn-secondary:hover { background: #30363d; }
  .status { font-size: 13px; color: #666; margin-top: 16px; min-height: 20px; }
  .status.ok { color: #3fb950; }
  .status.err { color: #f85149; }
  .footer { margin-top: 24px; font-size: 11px; color: #484f58; }
  .footer a { color: #58a6ff; text-decoration: none; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">🚀</div>
  <h1>Antigravity Navigator</h1>
  <p class="desc">Chuyển Antigravity tới cuộc trò chuyện</p>
  <div class="cid" id="cid" onclick="copyId()" title="Click to copy">—</div>
  <div>
    <a class="btn btn-primary" id="btn-nav" href="#" onclick="openNav(); return false;">Mở Antigravity</a>
  </div>
  <div class="status" id="status"></div>
  <div class="footer">
    <p>Cài <a href="https://github.com/vietndj/course" target="_blank">AgyNav.app</a> để click tự chuyển.</p>
    <p style="margin-top:4px">Hoặc chạy: <code style="color:#8b949e">python3 agy_navigate.py &lt;ID&gt;</code></p>
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const cid = params.get('c');
const el = {
  cid: document.getElementById('cid'),
  btn: document.getElementById('btn-nav'),
  status: document.getElementById('status'),
};

if (cid && /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/.test(cid)) {
  el.cid.textContent = cid;

  // Set up navigation link — try agy-nav:// URL scheme
  const navUrl = 'agy-nav://' + cid;
  el.btn.href = navUrl;

  // Auto-attempt navigation
  el.status.textContent = 'Đang mở Antigravity…';
  setTimeout(() => {
    window.location.href = navUrl;
    setTimeout(() => {
      el.status.textContent = 'Nếu không tự mở, hãy click nút phía trên.';
      el.status.className = 'status';
    }, 2000);
  }, 500);
} else {
  el.cid.textContent = 'Invalid or missing conversation ID';
  el.status.textContent = 'URL cần tham số ?c=<conversation-id>';
  el.status.className = 'status err';
  el.btn.style.display = 'none';
}

function copyId() {
  if (cid) {
    navigator.clipboard.writeText(cid).then(() => {
      el.status.textContent = '✅ Đã copy ID!';
      el.status.className = 'status ok';
      setTimeout(() => { el.status.textContent = ''; el.status.className = 'status'; }, 2000);
    });
  }
}

function openNav() {
  if (cid) {
    window.location.href = 'agy-nav://' + cid;
    el.status.textContent = '🚀 Đã gửi lệnh…';
    el.status.className = 'status ok';
  }
}
</script>
</body>
</html>
